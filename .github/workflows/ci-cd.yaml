name: Build, Push to GHCR, and Update Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'        # Only trigger when application code changes
      - '.github/workflows/ci-cd.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/my-custom-app

jobs:
  build-and-update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to commit the updated values.yaml back to Git
      packages: write   # Needed to push the Docker image to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Helm chart
        uses: azure/setup-helm@v4
        with:
          version: 'latest'
      - run: helm lint ./my-chart

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Update image tag in my-chart/values.yaml
        uses: mikefarah/yq@master
        with:
          cmd: |
            yq -i '.image.repository = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"' my-chart/values.yaml
            yq -i '.image.tag = "${{ github.sha }}"' my-chart/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-chart/values.yaml
          git diff --staged --quiet || git commit -m "chore(helm): update image tag to ${{ github.sha }}"
          git push

